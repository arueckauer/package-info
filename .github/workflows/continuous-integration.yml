name: "Continuous Integration"

on:
    pull_request:

jobs:
    lint-and-format:
        name: "Lint & Format (Mago)"
        runs-on: ubuntu-latest
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v7

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.5"
                    coverage: none

            -   name: "Install dependencies"
                uses: ramsey/composer-install@v4
                with:
                    require-lock-file: true

            -   name: "Lint"
                run: vendor/bin/mago lint
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: "Format check"
                run: vendor/bin/mago format --check

    analyze:
        name: "Static Analysis (Mago)"
        runs-on: ubuntu-latest
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v7

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.5"
                    coverage: none

            -   name: "Install dependencies"
                uses: ramsey/composer-install@v4
                with:
                    require-lock-file: true

            -   name: "Analyze"
                run: vendor/bin/mago analyze --baseline mago-baseline.toml
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    tests:
        name: "Tests"
        runs-on: ubuntu-latest
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v7

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.5"
                    coverage: none

            -   name: "Install dependencies"
                uses: ramsey/composer-install@v4
                with:
                    require-lock-file: true

            -   name: "Run tests"
                run: vendor/bin/phpunit

