name: "Continuous Integration"

on:
    pull_request:
    push:
        branches:
        tags:

jobs:
    lint-and-format:
        name: "Lint & Format (Mago)"
        runs-on: ubuntu-latest
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v4

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.4"
                    coverage: none

            -   name: "Install dependencies"
                uses: ramsey/composer-install@v3

            -   name: "Lint"
                run: vendor/bin/mago lint
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: "Format check"
                run: vendor/bin/mago format --check

    analyze:
        name: "Static Analysis (Mago)"
        runs-on: ubuntu-latest
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v4

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.4"
                    coverage: none

            -   name: "Install dependencies"
                uses: ramsey/composer-install@v3

            -   name: "Analyze"
                run: vendor/bin/mago analyze --baseline mago-baseline.toml
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    tests:
        name: "Tests (PHP ${{ matrix.php-version }})"
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-version:
                    - "8.4"
                    - "8.5"
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v4

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php-version }}"
                    coverage: none

            -   name: "Install dependencies"
                uses: ramsey/composer-install@v3

            -   name: "Run tests"
                run: vendor/bin/phpunit
